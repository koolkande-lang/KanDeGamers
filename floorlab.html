<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Concrete floor</title>
<style>
  :root{color-scheme:light}
  body{margin:0;background:#f4f4f6;color:#222;font:13px system-ui,sans-serif;padding:14px}
  h2{margin:0 0 4px;font-size:14px;letter-spacing:.06em}
  p{margin:0 0 10px;color:#666;font-size:12px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figcaption{font-size:11px;color:#555;margin-top:4px;text-align:center}
  canvas{display:block;border:1px solid #bbb;image-rendering:pixelated;background:#000}
</style></head>
<body>
<h2>CONCRETE FLOOR</h2>
<p>Left: the texture on its own. Middle: tiled 3&times;3 &mdash; the seams must be invisible.
   Right: laid out in perspective, roughly how it looks underfoot.</p>
<div class="row">
  <figure><canvas id="one" width="256" height="256"></canvas><figcaption>256&times;256 tile</figcaption></figure>
  <figure><canvas id="tile" width="384" height="384"></canvas><figcaption>tiled 3&times;3 (seam check)</figcaption></figure>
  <figure><canvas id="persp" width="420" height="300"></canvas><figcaption>in perspective, lit by a torch</figcaption></figure>
</div>

<script>
// ---------------------------------------------------------------
//  A concrete slab floor, generated rather than downloaded.
//  It has to TILE, because the same square metre is repeated across the
//  whole factory — so every bit of noise wraps around the edges.
// ---------------------------------------------------------------
// ---------------------------------------------------------------
//  This is the EXACT code the game uses, lifted straight out of hush.html,
//  so what you see here is what the factory floor actually looks like.
// ---------------------------------------------------------------
const rgb = (r, g, b) => (255 << 24) | (b << 16) | (g << 8) | r;   // little-endian RGBA
  const CONCRETE_N = 256;

  function cHash(ix, iy, period, seed) {
    ix = ((ix % period) + period) % period;
    iy = ((iy % period) + period) % period;
    let n = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(seed, 1442695041);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }
  // value noise on a lattice that wraps, so there are no seams
  function cNoise(x, y, period, seed) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = cHash(x0, y0, period, seed),     b = cHash(x0 + 1, y0, period, seed);
    const c = cHash(x0, y0 + 1, period, seed), d = cHash(x0 + 1, y0 + 1, period, seed);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }
  function cFbm(x, y, N, baseCells, octaves, seed) {
    let v = 0, amp = 0.5, cells = baseCells;
    for (let o = 0; o < octaves; o++) {
      v += cNoise(x / N * cells, y / N * cells, cells, seed + o * 17) * amp;
      cells *= 2; amp *= 0.5;
    }
    return v;
  }

  function makeConcrete(N, joints) {
    const out = new Uint32Array(N * N);

    // hairline cracks — short and faint, for the reason above
    const crack = new Float32Array(N * N);
    let cs = 12345;
    const rnd = () => (cs = (Math.imul(cs, 1103515245) + 12345) & 0x7fffffff) / 0x7fffffff;
    const nCracks = Math.max(3, (N / 28) | 0);
    for (let c = 0; c < nCracks; c++) {
      let x = rnd() * N, y = rnd() * N, a = rnd() * 6.28;
      const len = N * 0.05 + rnd() * N * 0.1;
      for (let k = 0; k < len; k++) {
        a += (rnd() - 0.5) * 0.7;
        x = (x + Math.cos(a) + N) % N;
        y = (y + Math.sin(a) + N) % N;
        const depth = Math.min(1, (len - k) / len * 1.4) * 0.22;
        const ix = x | 0, iy = y | 0;
        crack[iy * N + ix] = Math.max(crack[iy * N + ix], depth);
      }
    }

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const i = y * N + x;
        const blotch = cFbm(x, y, N, 2, 3, 11);      // damp patches
        const mottle = cFbm(x, y, N, 8, 4, 29);      // general cloudiness
        const grain  = cNoise(x / N * (N / 2), y / N * (N / 2), N / 2, 71);

        let v = 106
              + (blotch - 0.5) * 13
              + (mottle - 0.5) * 20
              + (grain  - 0.5) * 26;

        // aggregate — the little stones in the mix, pale and dark
        const agg = cNoise(x / N * (N * 0.375), y / N * (N * 0.375), (N * 0.375) | 0, 91);
        if (agg > 0.74) v += (agg - 0.74) * 190;
        else if (agg < 0.22) v -= (0.22 - agg) * 150;
        const agg2 = cNoise(x / N * (N * 0.7), y / N * (N * 0.7), (N * 0.7) | 0, 143);
        v += (agg2 - 0.5) * 20;

        // expansion joints, on the tile edge so they line up into a grid
        if (joints) {
          const dj = Math.min(x, N - 1 - x, y, N - 1 - y);
          const gw = Math.max(2, (N / 85) | 0);
          if (dj < gw) v *= 0.52 + dj * (0.4 / gw);         // the groove
          else if (dj < gw + 2) v *= 1.06;                  // lip catching light
        }

        // long faint drag marks
        const scuff = cNoise(x / N * 6, y / N * 52, 52, 131);
        v -= Math.max(0, scuff - 0.70) * 30;

        v *= 1 - crack[i] * 0.55;
        // concrete is grey, but very slightly warm
        out[i] = rgb(Math.min(255, v * 1.02) | 0, Math.min(255, v) | 0,
                     Math.min(255, v * 0.955) | 0);
      }
    }
    return out;
  }


const N = CONCRETE_N;
function toImageData(buf, n){
  const px = new Uint8ClampedArray(buf.buffer.slice(0));
  return new ImageData(px, n, n);
}
const img = toImageData(makeConcrete(N, true), N);
document.getElementById('one').getContext('2d').putImageData(img, 0, 0);

// tiled, to prove the edges match
{
  const c = document.getElementById('tile'), g = c.getContext('2d');
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = N;
  tmp.getContext('2d').putImageData(img, 0, 0);
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++)
    g.drawImage(tmp, x * 128, y * 128, 128, 128);
}

// a rough perspective view with a torch on it
{
  const c = document.getElementById('persp'), g = c.getContext('2d');
  const W = c.width, Hh = c.height;
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = N;
  tmp.getContext('2d').putImageData(img, 0, 0);
  const src = tmp.getContext('2d').getImageData(0, 0, N, N).data;
  const out = g.createImageData(W, Hh);
  const horizon = Hh * 0.30;
  for (let y = 0; y < Hh; y++) {
    if (y < horizon) {
      for (let x = 0; x < W; x++) { const o = (y*W+x)*4;
        out.data[o]=6; out.data[o+1]=7; out.data[o+2]=9; out.data[o+3]=255; }
      continue;
    }
    const p = y - horizon;
    const dist = (Hh * 0.55) / p;                  // how far away this row is
    for (let x = 0; x < W; x++) {
      const camX = (x / W - 0.5) * 2;
      const wx = camX * dist * 1.6, wz = dist;
      const tx = (((wx * 48) | 0) % N + N) % N;
      const ty = (((wz * 48) | 0) % N + N) % N;
      const s = (ty * N + tx) * 4;
      const beam = Math.max(0, 1 - Math.abs(camX) * 1.05);
      const lit = Math.min(1.25, (0.10 + beam * beam * 1.35) / (1 + dist * dist * 0.05));
      const o = (y * W + x) * 4;
      out.data[o]   = src[s]   * lit;
      out.data[o+1] = src[s+1] * lit;
      out.data[o+2] = src[s+2] * lit;
      out.data[o+3] = 255;
    }
  }
  g.putImageData(out, 0, 0);
}
</script>
</body></html>
